# Per-project pipeline. This is the ONLY workflow file you edit for a new project.
# All logic lives in reusable-s3-static-site.yml.
name: CI/CD - Hello World React

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-s3-static-site.yml
    permissions:
      id-token: write
      contents: read
    with:
      # --- project settings (change if your app is different) ---
      app-dir: "."
      node-version: "20"
      build-command: npm run build
      test-command: npm test
      build-dir: dist
      # --- deploy only from main, never from pull requests ---
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # --- AWS settings come from repo variables (Settings -> Secrets and variables -> Actions -> Variables) ---
      aws-region: ${{ vars.AWS_REGION }}
      s3-bucket: ${{ vars.S3_BUCKET }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
